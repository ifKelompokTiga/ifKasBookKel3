<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login & Register KasBook</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: radial-gradient(circle at top left, #c7d2fe 0%, transparent 35%),
                radial-gradient(circle at bottom right, #ddd6fe 0%, transparent 40%),
                linear-gradient(135deg, #eef2ff, #f8fafc);
    overflow: hidden;
    position: relative;
}

body::before {
    content: ""; position: absolute; width: 450px; height: 450px;
    background: #6366f1; opacity: 0.08; border-radius: 50%;
    top: -120px; left: -120px; filter: blur(40px); z-index: -1;
}
body::after {
    content: ""; position: absolute; width: 400px; height: 400px;
    background: #8b5cf6; opacity: 0.08; border-radius: 50%;
    bottom: -120px; right: -120px; filter: blur(40px); z-index: -1;
}

.login-container {
    width: 100%;
    max-width: 380px;
    background: rgba(255, 255, 255, 0.75);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    padding: 40px;
    border-radius: 30px;
    border: 1px solid rgba(255, 255, 255, 0.5);
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.08);
    text-align: center;
}

.login-container h2 {
    font-size: 32px;
    font-weight: 800;
    margin-top: 0;
    margin-bottom: 25px;
    color: #0f172a;
    letter-spacing: -0.5px;
}

input {
    width: 100%;
    padding: 15px 18px;
    margin-bottom: 18px;
    box-sizing: border-box;
    border-radius: 15px;
    border: 1px solid #dbeafe;
    background: white;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 15px;
    color: #1e293b;
    transition: all 0.3s ease;
    outline: none;
}

input:focus {
    border-color: #6366f1;
    box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
}

button {
    width: 100%;
    padding: 15px;
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    color: white;
    font-size: 16px;
    font-weight: 700;
    border: none;
    border-radius: 15px;
    cursor: pointer;
    box-sizing: border-box;
    transition: all 0.3s ease;
    box-shadow: 0 8px 20px rgba(99, 102, 241, 0.2);
}

button:hover {
    transform: translateY(-3px);
    box-shadow: 0 15px 25px rgba(99, 102, 241, 0.3);
}

button:active {
    transform: translateY(1px);
}

.toggle-text {
    margin-top: 25px;
    font-size: 14px;
    color: #64748b;
}

.toggle-text a {
    color: #6366f1;
    text-decoration: none;
    font-weight: 600;
}

.toggle-text a:hover {
    text-decoration: underline;
}

/* Menyembunyikan form yang tidak aktif */
.hidden {
    display: none;
}
</style>
</head>

<body>

<div class="login-container">
    <div id="loginForm">
        <h2>Login</h2>
        <input type="text" id="loginUsername" placeholder="Username">
        <input type="password" id="loginPassword" placeholder="Password">
        <button onclick="login()">Masuk</button>
        <p class="toggle-text">Belum punya akun? <a href="#" onclick="toggleForm()">Daftar Sekarang</a></p>
    </div>

    <div id="registerForm" class="hidden">
        <h2>Daftar Akun</h2>
        <input type="text" id="regUsername" placeholder="Buat Username Baru">
        <input type="password" id="regPassword" placeholder="Buat Password Baru">
        <button onclick="register()">Daftar</button>
        <p class="toggle-text">Sudah punya akun? <a href="#" onclick="toggleForm()">Masuk di sini</a></p>
    </div>
</div>

<script>
// Data akun bawaan sistem
const defaultUsers = {
    "admin": { password: "admin123", role: "admin" },
    "user": { password: "user123", role: "user" }
};

// Mengambil data akun kustom dari localStorage atau membuat objek kosong jika belum ada
let customUsers = JSON.parse(localStorage.getItem("registeredUsers")) || {};

// Fungsi untuk beralih tampilan form
function toggleForm() {
    document.getElementById("loginForm").classList.toggle("hidden");
    document.getElementById("registerForm").classList.toggle("hidden");
    
    // Kosongkan input saat berpindah form
    document.getElementById("loginUsername").value = "";
    document.getElementById("loginPassword").value = "";
    document.getElementById("regUsername").value = "";
    document.getElementById("regPassword").value = "";
}

// Fungsi Pendaftaran Akun Baru
function register() {
    let username = document.getElementById("regUsername").value.trim();
    let password = document.getElementById("regPassword").value.trim();

    if (username === "" || password === "") {
        alert("Username dan Password tidak boleh kosong!");
        return;
    }

    // Periksa apakah username sudah terdaftar di sistem bawaan atau kustom
    if (defaultUsers[username] || customUsers[username]) {
        alert("Username ini sudah terdaftar. Silakan gunakan nama lain.");
        return;
    }

    // Simpan akun baru ke objek kustom dengan role standar "user"
    customUsers[username] = { password: password, role: "user" };
    localStorage.setItem("registeredUsers", JSON.stringify(customUsers));

    alert("Pendaftaran berhasil! Silakan login dengan akun baru Anda.");
    toggleForm(); // Otomatis kembali ke form login
}

// Fungsi Login
function login() {
    let username = document.getElementById("loginUsername").value.trim();
    let password = document.getElementById("loginPassword").value.trim();

    // 1. Cek dari user bawaan terlebih dahulu
    if (defaultUsers[username] && defaultUsers[username].password === password) {
        localStorage.setItem("currentUser", JSON.stringify({ username: username, role: defaultUsers[username].role }));
        window.location.href = "index.html";
    } 
    // 2. Cek dari user kustom hasil registrasi baru
    else if (customUsers[username] && customUsers[username].password === password) {
        localStorage.setItem("currentUser", JSON.stringify({ username: username, role: customUsers[username].role }));
        window.location.href = "index.html";
    } 
    else {
        alert("Username atau Password salah");
    }
}
</script>

</body>
</html>
