<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login KasBook</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f5f5f5;
}

.login-container {
    width: 350px;
    margin: 100px auto;
    background: white;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 0 10px rgba(0,0,0,.1);
}

input {
    width: 100%;
    padding: 10px;
    margin: 8px 0;
    box-sizing: border-box; /* Tambahan agar input tidak melebihi container */
}

button {
    width: 100%;
    padding: 10px;
    background: #2563eb;
    color: white;
    border: none;
    cursor: pointer;
    box-sizing: border-box; /* Tambahan agar button sejajar dengan input */
}
</style>
</head>

<body>

<div class="login-container">
    <h2>Login</h2>
    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">
    <button onclick="login()">Masuk</button>
    
    </div>

<script>
function login() {
    let username = document.getElementById("username").value;
    let password = document.getElementById("password").value;

    if (username === "admin" && password === "admin123") {
        // Simpan data dalam format object JSON
        localStorage.setItem("currentUser", JSON.stringify({ username: "admin", role: "admin" }));
        window.location.href = "index.html";
    } 
    else if (username === "user" && password === "user123") {
        // Simpan data dalam format object JSON
        localStorage.setItem("currentUser", JSON.stringify({ username: "user", role: "user" }));
        window.location.href = "index.html";
    } 
    else {
        alert("Username atau Password salah");
    }
}
</script>

</body>
</html>
