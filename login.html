<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login KasBook</title>

<style>
/* Mengimpor font yang sama dengan index.html */
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    /* Latar belakang gradasi sesuai tema Neo Finance */
    background: radial-gradient(circle at top left, #c7d2fe 0%, transparent 35%),
                radial-gradient(circle at bottom right, #ddd6fe 0%, transparent 40%),
                linear-gradient(135deg, #eef2ff, #f8fafc);
    overflow: hidden;
    position: relative;
}

/* Efek bola cahaya di latar belakang (Khas tema kamu) */
body::before {
    content: ""; position: absolute; width: 450px; height: 450px;
    background: #6366f1; opacity: 0.08; border-radius: 50%;
    top: -120px; left: -120px; filter: blur(40px); z-index: -1;
}
body::after {
    content: ""; position: absolute; width: 400px; height: 400px;
    background: #8b5cf6; opacity: 0.08; border-radius: 50%;
    bottom: -120px; right: -120px; filter: blur(40px); z-index: -1;
}

/* Form Login dengan efek Glassmorphism */
.login-container {
    width: 100%;
    max-width: 380px;
    background: rgba(255, 255, 255, 0.75);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px); /* Dukungan Safari */
    padding: 40px;
    border-radius: 30px;
    border: 1px solid rgba(255, 255, 255, 0.5);
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.08);
    text-align: center;
}

.login-container h2 {
    font-size: 32px;
    font-weight: 800;
    margin-top: 0;
    margin-bottom: 25px;
    color: #0f172a;
    letter-spacing: -0.5px;
}

/* Styling Input agar lebih modern */
input {
    width: 100%;
    padding: 15px 18px;
    margin-bottom: 18px;
    box-sizing: border-box;
    border-radius: 15px;
    border: 1px solid #dbeafe;
    background: white;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 15px;
    color: #1e293b;
    transition: all 0.3s ease;
    outline: none;
}

/* Efek saat input sedang diketik */
input:focus {
    border-color: #6366f1;
    box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
}

/* Styling Tombol gradasi */
button {
    width: 100%;
    padding: 15px;
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    color: white;
    font-size: 16px;
    font-weight: 700;
    border: none;
    border-radius: 15px;
    cursor: pointer;
    box-sizing: border-box;
    transition: all 0.3s ease;
    box-shadow: 0 8px 20px rgba(99, 102, 241, 0.2);
}

button:hover {
    transform: translateY(-3px);
    box-shadow: 0 15px 25px rgba(99, 102, 241, 0.3);
}

button:active {
    transform: translateY(1px);
}
</style>
</head>

<body>

<div class="login-container">
    <h2>Login</h2>
    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">
    <button onclick="login()">Masuk</button>
    
    </div>

<script>
function login() {
    let username = document.getElementById("username").value;
    let password = document.getElementById("password").value;

    if (username === "admin" && password === "admin123") {
        // Simpan data dalam format object JSON
        localStorage.setItem("currentUser", JSON.stringify({ username: "admin", role: "admin" }));
        window.location.href = "index.html";
    } 
    else if (username === "user" && password === "user123") {
        // Simpan data dalam format object JSON
        localStorage.setItem("currentUser", JSON.stringify({ username: "user", role: "user" }));
        window.location.href = "index.html";
    } 
    else {
        alert("Username atau Password salah");
    }
}
</script>

</body>
</html>
