<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login & Register KasBook</title>

<style>
        /* Mengambil font modern 'Poppins' dari Google Fonts */
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        /* 1. Animasi Background Berjalan */
        body {
            /* Menggunakan gradasi warna pastel seperti pada referensi gambar */
            background: linear-gradient(-45deg, #e0c3fc, #8ec5fc, #f5f7fa, #d4fc79);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Keyframes untuk Background */
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 2. Animasi Card Login Muncul (Slide Up & Fade In) */
        .login-card {
            background-color: #ffffff;
            width: 100%;
            max-width: 420px;
            padding: 50px 40px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
            text-align: center;
            
            /* Konfigurasi awal animasi muncul */
            opacity: 0;
            transform: translateY(30px);
            animation: slideUpFade 0.8s ease-out forwards;
        }

        /* Keyframes untuk Card Login */
        @keyframes slideUpFade {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-card h2 {
            font-size: 32px;
            color: #1a1a2e;
            margin-bottom: 30px;
            font-weight: 700;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .input-group {
            width: 100%;
        }

        /* Styling Input */
        .input-group input {
            width: 100%;
            padding: 16px 20px;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            font-size: 15px;
            color: #333;
            outline: none;
            transition: all 0.3s ease;
        }

        /* Efek Animasi saat Input diklik (Focus) */
        .input-group input:focus {
            border-color: #8b5cf6;
            box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.1);
            transform: translateY(-2px);
        }

        .input-group input::placeholder {
            color: #a0aec0;
        }

        /* Styling Button */
        .btn-login {
            width: 100%;
            padding: 16px;
            margin-top: 10px;
            background: linear-gradient(135deg, #8b5cf6, #6d28d9);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(109, 40, 217, 0.3);
        }

        /* 3. Efek Animasi Hover pada Tombol */
        .btn-login:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 25px rgba(109, 40, 217, 0.4);
        }

        .btn-login:active {
            transform: translateY(0) scale(0.98);
        }

        /* Styling Footer Text */
        .footer-text {
            margin-top: 25px;
            font-size: 14px;
            color: #718096;
        }

        .footer-text a {
            color: #5a67d8;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .footer-text a:hover {
            color: #4c51bf;
            text-decoration: underline;
        }
    </style>
    
</head>

<body>

<div class="login-container">
    <div id="loginForm">
        <h2>Login</h2>
        <input type="text" id="loginUsername" placeholder="Username">
        <input type="password" id="loginPassword" placeholder="Password">
        <button onclick="login()">Masuk</button>
        <p class="toggle-text">Belum punya akun? <a href="#" onclick="toggleForm()">Daftar Sekarang</a></p>
    </div>

    <div id="registerForm" class="hidden">
        <h2>Daftar Akun</h2>
        <input type="text" id="regUsername" placeholder="Buat Username Baru">
        <input type="password" id="regPassword" placeholder="Buat Password Baru">
        <button onclick="register()">Daftar</button>
        <p class="toggle-text">Sudah punya akun? <a href="#" onclick="toggleForm()">Masuk di sini</a></p>
    </div>
</div>

<script>
// Data akun bawaan sistem
const defaultUsers = {
    "admin": { password: "admin123", role: "admin" },
    "user": { password: "user123", role: "user" }
};

// Mengambil data akun kustom dari localStorage atau membuat objek kosong jika belum ada
let customUsers = JSON.parse(localStorage.getItem("registeredUsers")) || {};

// Fungsi untuk beralih tampilan form
function toggleForm() {
    document.getElementById("loginForm").classList.toggle("hidden");
    document.getElementById("registerForm").classList.toggle("hidden");
    
    // Kosongkan input saat berpindah form
    document.getElementById("loginUsername").value = "";
    document.getElementById("loginPassword").value = "";
    document.getElementById("regUsername").value = "";
    document.getElementById("regPassword").value = "";
}

// Fungsi Pendaftaran Akun Baru
function register() {
    let username = document.getElementById("regUsername").value.trim();
    let password = document.getElementById("regPassword").value.trim();

    if (username === "" || password === "") {
        alert("Username dan Password tidak boleh kosong!");
        return;
    }

    // Periksa apakah username sudah terdaftar di sistem bawaan atau kustom
    if (defaultUsers[username] || customUsers[username]) {
        alert("Username ini sudah terdaftar. Silakan gunakan nama lain.");
        return;
    }

    // Simpan akun baru ke objek kustom dengan role standar "user"
    customUsers[username] = { password: password, role: "user" };
    localStorage.setItem("registeredUsers", JSON.stringify(customUsers));

    alert("Pendaftaran berhasil! Silakan login dengan akun baru Anda.");
    toggleForm(); // Otomatis kembali ke form login
}

// Fungsi Login
function login() {
    let username = document.getElementById("loginUsername").value.trim();
    let password = document.getElementById("loginPassword").value.trim();

    // 1. Cek dari user bawaan terlebih dahulu
    if (defaultUsers[username] && defaultUsers[username].password === password) {
        localStorage.setItem("currentUser", JSON.stringify({ username: username, role: defaultUsers[username].role }));
        window.location.href = "index.html";
    } 
    // 2. Cek dari user kustom hasil registrasi baru
    else if (customUsers[username] && customUsers[username].password === password) {
        localStorage.setItem("currentUser", JSON.stringify({ username: username, role: customUsers[username].role }));
        window.location.href = "index.html";
    } 
    else {
        alert("Username atau Password salah");
    }
}
</script>

</body>
</html>
