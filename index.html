<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Neo Finance — Premium Wallet</title>

    <!-- FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- TAILWIND & ICONS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] },
                    colors: {
                        brand: {
                            50: '#f5f3ff', 100: '#ede9fe', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background: #fafafa;
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.1) 0px, transparent 50%);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.03);
        }

        .balance-card {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            color: white;
        }

        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }

        @keyframes slideIn {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .animate-entry { animation: slideIn 0.4s ease-out forwards; }
    </style>
</head>

<body class="min-h-screen text-slate-900 selection:bg-brand-100 selection:text-brand-700">

<!-- LOGIN OVERLAY -->
<div id="loginOverlay"
class="fixed inset-0 bg-slate-950/90 flex items-center justify-center z-[9999]">

    <div class="bg-white p-8 rounded-3xl w-[350px] shadow-2xl">
        <h2 class="text-2xl font-bold mb-5">Login</h2>

        <input id="username"
        type="text"
        placeholder="Username"
        class="w-full mb-3 p-3 rounded-xl bg-slate-100">

        <input id="password"
        type="password"
        placeholder="Password"
        class="w-full mb-4 p-3 rounded-xl bg-slate-100">

        <button onclick="login()"
        class="w-full bg-brand-600 text-white py-3 rounded-xl font-bold">
            Masuk
        </button>

        <p class="mt-3 text-xs text-slate-500">
            Admin : admin/admin123<br>
            User : user/user123
        </p>
    </div>
</div>

<!-- NAV BAR -->
<nav class="sticky top-0 z-50 glass-card border-b border-slate-200/50 px-6 py-4">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
        <div class="flex items-center gap-3">
            <div class="bg-brand-600 p-2.5 rounded-xl shadow-lg shadow-brand-500/20">
                <i data-lucide="wallet" class="w-6 h-6 text-white"></i>
            </div>
            <div>
                <h1 class="text-xl font-800 tracking-tight text-slate-900">NEO<span class="text-brand-600">FINANCE</span></h1>
                <p class="text-[10px] uppercase tracking-[0.2em] font-bold text-slate-400">Personal Wealth Lab</p>
            </div>
        </div>
        <div class="flex items-center gap-4">

        <div class="hidden md:block text-right">
            <p id="userName" class="font-bold text-slate-800"></p>
            <p id="todayDate" class="text-sm font-semibold text-slate-700"></p>
            <p class="text-xs text-slate-400">Status: Kelompok 2</p>
        </div>

            <button
                onclick="logout()"
                class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-xl font-semibold transition">
                Logout
            </button>

        </div>
    </div>
</nav>

<main class="max-w-7xl mx-auto px-6 py-8">
    
    <!-- DASHBOARD STATS -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
        <!-- Main Balance -->
        <div class="balance-card rounded-[2rem] p-8 relative overflow-hidden shadow-2xl shadow-slate-900/20">
            <div class="relative z-10">
                <p class="text-slate-400 text-sm font-medium mb-1">Available Balance</p>
                <h2 id="saldo" class="text-4xl font-extrabold tracking-tight mb-6">Rp 0</h2>
                <div class="flex items-center gap-2 text-xs font-bold text-slate-400 bg-white/5 w-fit px-3 py-1.5 rounded-full">
                    <i data-lucide="arrow-right-left" class="w-3 h-3 text-brand-400"></i>
                    <span id="txCount">0 TRANSACTIONS</span>
                </div>
            </div>
            <div class="absolute -right-8 -bottom-8 opacity-10">
                <i data-lucide="landmark" class="w-48 h-48"></i>
            </div>
        </div>

        <!-- Income Stats -->
        <div class="glass-card rounded-[2rem] p-8 flex flex-col justify-between group hover:border-emerald-200 transition-colors">
            <div class="flex justify-between items-start">
                <div class="bg-emerald-50 p-3 rounded-2xl text-emerald-600">
                    <i data-lucide="trending-up" class="w-6 h-6"></i>
                </div>
                <span class="text-[10px] font-bold text-emerald-600 bg-emerald-50 px-2 py-1 rounded-md">INCOME</span>
            </div>
            <div class="mt-4">
                <h3 id="incomeTotal" class="text-3xl font-bold text-slate-800">Rp 0</h3>
                <p id="incomeCount" class="text-sm text-slate-500 mt-1">0 records</p>
            </div>
        </div>

        <!-- Expense Stats -->
        <div class="glass-card rounded-[2rem] p-8 flex flex-col justify-between group hover:border-rose-200 transition-colors">
            <div class="flex justify-between items-start">
                <div class="bg-rose-50 p-3 rounded-2xl text-rose-600">
                    <i data-lucide="trending-down" class="w-6 h-6"></i>
                </div>
                <span class="text-[10px] font-bold text-rose-600 bg-rose-50 px-2 py-1 rounded-md">EXPENSE</span>
            </div>
            <div class="mt-4">
                <h3 id="expenseTotal" class="text-3xl font-bold text-slate-800">Rp 0</h3>
                <p id="expenseCount" class="text-sm text-slate-500 mt-1">0 records</p>
            </div>
        </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
        
        <!-- TRANSACTION FORM -->
        <div class="lg:col-span-4 space-y-6">
            <div class="glass-card rounded-[2rem] p-8 shadow-xl">
                <h3 class="text-lg font-bold mb-6 flex items-center gap-2">
                    <i data-lucide="plus-circle" class="w-5 h-5 text-brand-600"></i>
                    New Transaction
                </h3>

                <!-- Type Toggle -->
                <div class="flex bg-slate-100 p-1.5 rounded-2xl mb-8">
                    <button id="incomeBtn" onclick="setType('income')" 
                        class="flex-1 py-3 rounded-xl text-sm font-bold transition-all bg-white text-emerald-600 shadow-sm">
                        Income
                    </button>
                    <button id="expenseBtn" onclick="setType('expense')" 
                        class="flex-1 py-3 rounded-xl text-sm font-bold transition-all text-slate-500">
                        Expense
                    </button>
                </div>

                <form id="form" onsubmit="addTransaction(event)" class="space-y-5">
                    <div>
                        <label class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2 block pl-1">Description</label>
                        <input id="desc" type="text" required placeholder="Ex: Project Salary" 
                            class="w-full bg-slate-50 border-none rounded-2xl px-5 py-4 focus:ring-2 focus:ring-brand-500 outline-none transition-all placeholder:text-slate-300">
                    </div>
                    
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2 block pl-1">Amount</label>
                            <input id="amount" type="number" required placeholder="0" 
                                class="w-full bg-slate-50 border-none rounded-2xl px-5 py-4 focus:ring-2 focus:ring-brand-500 outline-none">
                        </div>
                        <div>
                            <label class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2 block pl-1">Date</label>
                            <input id="date" type="date" required 
                                class="w-full bg-slate-50 border-none rounded-2xl px-5 py-4 focus:ring-2 focus:ring-brand-500 outline-none text-sm">
                        </div>
                    </div>

                    <div>
                        <label class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2 block pl-1">Category</label>
                        <select id="category" required 
                            class="w-full bg-slate-50 border-none rounded-2xl px-5 py-4 focus:ring-2 focus:ring-brand-500 outline-none appearance-none cursor-pointer">
                        </select>
                    </div>

                    <button id="submitBtn" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-bold py-4 rounded-2xl transition-all shadow-lg shadow-brand-500/25 active:scale-95">
                        Confirm Transaction
                    </button>
                </form>
            </div>
        </div>

        <!-- HISTORY LIST -->
        <div class="lg:col-span-8">
            <div class="glass-card rounded-[2rem] p-8 flex flex-col h-[750px]">
                <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-8">
                    <div>
                        <h3 class="text-xl font-bold">Transaction History</h3>
                        <p class="text-slate-400 text-sm">Review your financial activity</p>
                    </div>
                    
                    <div class="flex bg-slate-100 p-1 rounded-xl w-full md:w-auto">
                        <button onclick="setFilter('all', this)" class="filter-btn px-5 py-2 rounded-lg text-xs font-bold bg-white text-slate-900 shadow-sm transition-all">All</button>
                        <button onclick="setFilter('income', this)" class="filter-btn px-5 py-2 rounded-lg text-xs font-bold text-slate-500 transition-all">Income</button>
                        <button onclick="setFilter('expense', this)" class="filter-btn px-5 py-2 rounded-lg text-xs font-bold text-slate-500 transition-all">Expense</button>
                    </div>
                </div>

                <!-- Search -->
                <div class="relative mb-6">
                    <i data-lucide="search" class="absolute left-5 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i>
                    <input id="search" oninput="renderTransactions()" type="text" placeholder="Search by name or category..." 
                        class="w-full bg-slate-100 border-none rounded-2xl pl-12 pr-5 py-4 focus:ring-2 focus:ring-brand-500 outline-none text-sm">
                </div>

                <!-- List Content -->
                <div id="transactionList" class="custom-scroll overflow-y-auto flex-1 space-y-4 pr-2">
                    <!-- Cards will be injected here -->
                </div>
            </div>
        </div>
    </div>
</main>

<!-- TOASTS -->
<div id="toastContainer" class="fixed bottom-8 left-1/2 -translate-x-1/2 z-[100] space-y-2 pointer-events-none"></div>

<script>
    let transactions = JSON.parse(localStorage.getItem('neo_tx')) || [];
    let currentType = 'income';
    let currentFilter = 'all';

    const categories = {
        income: ['Salary', 'Bonus', 'Investment', 'Business', 'Freelance', 'Gifts'],
        expense: ['Food & Drink', 'Transport', 'Shopping', 'Bills', 'Health', 'Entertainment']
    };

    const currency = new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 });
    const dateFormat = new Intl.DateTimeFormat('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });

    window.onload = () => {

    const currentUser =
    JSON.parse(localStorage.getItem('currentUser'));

    if (currentUser) {

    document.getElementById('loginOverlay').style.display = 'none';

    document.getElementById("userName").innerHTML =
        "👤 " + currentUser.username;

    }

    if (currentUser) {
        document.getElementById('loginOverlay').style.display = 'none';
    }

    document.getElementById('todayDate').innerText =
        new Intl.DateTimeFormat(
            'id-ID',
            { dateStyle: 'full' }
        ).format(new Date());

    document.getElementById('date').valueAsDate = new Date();

    updateCategory();
    updateSummary();
    renderTransactions();
    lucide.createIcons();
    };

    function setType(type) {
        currentType = type;
        const isIncome = type === 'income';
        
        document.getElementById('incomeBtn').className = `flex-1 py-3 rounded-xl text-sm font-bold transition-all ${isIncome ? 'bg-white text-emerald-600 shadow-sm' : 'text-slate-500'}`;
        document.getElementById('expenseBtn').className = `flex-1 py-3 rounded-xl text-sm font-bold transition-all ${!isIncome ? 'bg-white text-rose-600 shadow-sm' : 'text-slate-500'}`;
        
        const btn = document.getElementById('submitBtn');
        btn.className = `w-full ${isIncome ? 'bg-emerald-600 hover:bg-emerald-700 shadow-emerald-500/25' : 'bg-rose-600 hover:bg-rose-700 shadow-rose-500/25'} text-white font-bold py-4 rounded-2xl transition-all shadow-lg active:scale-95`;
        btn.innerText = `Confirm ${type.charAt(0).toUpperCase() + type.slice(1)}`;
        
        updateCategory();
    }

    function updateCategory() {
        const select = document.getElementById('category');
        select.innerHTML = categories[currentType].map(cat => `<option value="${cat}">${cat}</option>`).join('');
    }

    function addTransaction(e) {
        e.preventDefault();
        const tx = {
            id: Date.now(),
            type: currentType,
            desc: document.getElementById('desc').value,
            amount: parseFloat(document.getElementById('amount').value),
            category: document.getElementById('category').value,
            date: document.getElementById('date').value
        };

        transactions.unshift(tx);
        saveData();
        document.getElementById('form').reset();
        document.getElementById('date').valueAsDate = new Date();
        updateSummary();
        renderTransactions();
        showToast(`Successfully added ${tx.type}`);
    }

    function removeTransaction(id) {
        transactions = transactions.filter(tx => tx.id !== id);
        saveData();
        updateSummary();
        renderTransactions();
        showToast('Transaction removed', 'error');
    }

    function saveData() {
        localStorage.setItem('neo_tx', JSON.stringify(transactions));
    }

    function updateSummary() {
        let income = 0, expense = 0, inCount = 0, exCount = 0;
        transactions.forEach(tx => {
            if(tx.type === 'income') { income += tx.amount; inCount++; }
            else { expense += tx.amount; exCount++; }
        });

        document.getElementById('saldo').innerText = currency.format(income - expense);
        document.getElementById('incomeTotal').innerText = currency.format(income);
        document.getElementById('expenseTotal').innerText = currency.format(expense);
        document.getElementById('txCount').innerText = `${transactions.length} TRANSACTIONS`;
        document.getElementById('incomeCount').innerText = `${inCount} records`;
        document.getElementById('expenseCount').innerText = `${exCount} records`;
    }

    function setFilter(type, el) {
        currentFilter = type;
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.classList.remove('bg-white', 'text-slate-900', 'shadow-sm');
            btn.classList.add('text-slate-500');
        });
        el.classList.add('bg-white', 'text-slate-900', 'shadow-sm');
        renderTransactions();
    }

    function renderTransactions() {
        const container = document.getElementById('transactionList');
        const searchTerm = document.getElementById('search').value.toLowerCase();
        
        const filtered = transactions.filter(tx => {
            const matchesFilter = currentFilter === 'all' || tx.type === currentFilter;
            const matchesSearch = tx.desc.toLowerCase().includes(searchTerm) || tx.category.toLowerCase().includes(searchTerm);
            return matchesFilter && matchesSearch;
        });

        if (filtered.length === 0) {
            container.innerHTML = `
                <div class="h-full flex flex-col items-center justify-center opacity-40">
                    <i data-lucide="database" class="w-16 h-16 mb-4"></i>
                    <p class="font-bold">No entries found</p>
                </div>`;
            lucide.createIcons();
            return;
        }

        container.innerHTML = filtered.map((tx, idx) => `
            <div class="animate-entry flex items-center justify-between p-5 bg-slate-50/50 rounded-[1.5rem] border border-transparent hover:border-slate-200 hover:bg-white transition-all group" style="animation-delay: ${idx * 0.05}s">
                <div class="flex items-center gap-5">
                    <div class="w-12 h-12 rounded-2xl flex items-center justify-center ${tx.type === 'income' ? 'bg-emerald-100 text-emerald-600' : 'bg-rose-100 text-rose-600'}">
                        <i data-lucide="${tx.type === 'income' ? 'arrow-up-right' : 'arrow-down-left'}" class="w-5 h-5"></i>
                    </div>
                    <div>
                        <h4 class="font-bold text-slate-800">${tx.desc}</h4>
                        <div class="flex items-center gap-2 mt-0.5">
                            <span class="text-[10px] font-extrabold uppercase px-2 py-0.5 bg-slate-200 rounded text-slate-500 tracking-tighter">${tx.category}</span>
                            <span class="text-xs text-slate-400 font-medium">${dateFormat.format(new Date(tx.date))}</span>
                        </div>
                    </div>
                </div>
                <div class="flex items-center gap-6">
                    <div class="text-right">
                        <p class="font-extrabold ${tx.type === 'income' ? 'text-emerald-600' : 'text-rose-600'}">
                            ${tx.type === 'income' ? '+' : '-'} ${currency.format(tx.amount)}
                        </p>
                    </div>
                    <button onclick="removeTransaction(${tx.id})" class="opacity-0 group-hover:opacity-100 p-2 hover:bg-rose-50 hover:text-rose-600 rounded-xl transition-all text-slate-300">
                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>
        `).join('');
        lucide.createIcons();
    }

    function showToast(msg, type = 'success') {
        const container = document.getElementById('toastContainer');
        const toast = document.createElement('div');
        toast.className = `flex items-center gap-3 px-6 py-3 rounded-2xl shadow-2xl text-white font-bold text-sm transition-all duration-500 animate-entry ${type === 'success' ? 'bg-slate-900' : 'bg-rose-600'}`;
        toast.innerHTML = `<i data-lucide="${type === 'success' ? 'check-circle' : 'alert-circle'}" class="w-4 h-4"></i> ${msg}`;
        container.appendChild(toast);
        lucide.createIcons();
        setTimeout(() => { toast.style.opacity = '0'; toast.style.transform = 'translateY(-20px)'; setTimeout(() => toast.remove(), 500); }, 3000);
    }

    // ================= LOGIN SYSTEM =================

const USERS = {
    admin: {
        password: 'admin123',
        role: 'admin'
    },
    user: {
        password: 'user123',
        role: 'user'
    }
};

function login() {

    const username =
        document.getElementById('username').value;

    const password =
        document.getElementById('password').value;

    if (
        USERS[username] &&
        USERS[username].password === password
    ) {

        localStorage.setItem(
            'currentUser',
            JSON.stringify({
                username,
                role: USERS[username].role
            })
        );

        document.getElementById('loginOverlay').style.display = 'none';

        showToast('Login berhasil');

    } else {

        alert('Username atau Password salah');

    }
}
function logout(){

    if(confirm("Apakah Anda yakin ingin logout?")){

        localStorage.removeItem("currentUser");

        window.location.reload();

    }

}
    
</script>
</body>
</html>
